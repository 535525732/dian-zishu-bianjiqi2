  getCoverDataURL(function(cdata){
	var isCustom = !!(state.book.cover && state.book.cover.type==='custom' && cdata && /^data:image\//.test(cdata));
	collectImages(function(imageResults){
	  var zip = new MiniZip();
	  zip.file('mimetype', 'application/epub+zip');
	  zip.file('META-INF/container.xml', '<?xml version="1.0" encoding="UTF-8"?>\n'
		+ '<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">'
		+ '<rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>');
	  zip.file('OEBPS/style.css', styleCss());
	  zip.file('OEBPS/nav.xhtml', buildNavDoc());
	  zip.file('OEBPS/cover.xhtml', buildCoverXhtml(isCustom));
	  if(isCustom){
		var m = cdata.match(/^data:image\/(\w+);base64,(.+)$/);
		if(m) zip.file('OEBPS/cover.jpg', m[2], { base64:true });
	  }
	  state.chapters.forEach(function(c,i){
		var html = (c.html||'');
		imageResults.forEach(function(r){ html = html.split(r.original).join(r.localPath); });
		zip.file('OEBPS/ch'+i+'.xhtml', buildChapterXhtml({ title:c.title, html: html }));
	  });
	  var imageItems = [];
	  imageResults.forEach(function(r){
		if(r.localPath && r.base64){
		  zip.file('OEBPS/images/'+r.filename, r.base64, { base64:true });
		  imageItems.push({ id:r.id, href:'images/'+r.filename, mime:r.mime });
		}
	  });
	  zip.file('OEBPS/content.opf', containerXml(isCustom, imageItems));
	  zip.generateAsync({ type:'blob', mimeType:'application/epub+zip' })
		.then(function(blob){
		  downloadBlob(blob, name+'.epub', 'application/epub+zip');
		  var n = imageResults.filter(function(r){return r.base64;}).length;
		  toast('已导出 '+name+'.epub' + (n?('（含 '+n+' 张图片）'):''));
		})
		.catch(function(e){ alert('打包失败：'+(e && e.message ? e.message : e)); });
	});
  });
}

function collectImages(cb){
  var urls = {};
  state.chapters.forEach(function(c){
	var d = document.createElement('div'); d.innerHTML = c.html || '';
	d.querySelectorAll('img').forEach(function(img){
	  var src = img.getAttribute('src');
	  if(src) urls[src] = true;
	});
  });
  var list = Object.keys(urls);
  if(!list.length){ cb([]); return; }
  var results = [], done = 0;
  list.forEach(function(src){
	if(/^data:image\//.test(src)){
	  var m = src.match(/^data:image\/(\w+);base64,(.+)$/);
	  if(m){
		var ext = m[1]==='jpeg'?'jpg':m[1];
		results.push({ original:src, filename:'img_'+Math.random().toString(36).slice(2,8)+'.'+ext, localPath:'', base64:m[2], mime:'image/'+m[1], id:'img'+Math.random().toString(36).slice(2,8) });
	  }
	  if(++done >= list.length) finish(); return;
	}
	if(/^https?:\/\//i.test(src)){
	  fetch(src, { mode:'cors' })
		.then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.blob(); })
		.then(function(blob){
		  return new Promise(function(res){
			var fr = new FileReader();
			fr.onload = function(){
			  var m = fr.result.match(/^data:image\/(\w+);base64,(.+)$/);
			  if(m){
				var ext = m[1]==='jpeg'?'jpg':m[1];
				results.push({ original:src, filename:'img_'+Math.random().toString(36).slice(2,8)+'.'+ext, localPath:'', base64:m[2], mime:'image/'+m[1], id:'img'+Math.random().toString(36).slice(2,8) });
			  }
			  res();
			};
			fr.readAsDataURL(blob);
		  });
		})
		.catch(function(){})
		.then(function(){ if(++done >= list.length) finish(); });
	  return;
	}
	if(++done >= list.length) finish();
  });
  function finish(){
	results.forEach(function(r){ r.localPath = 'images/' + r.filename; });
	cb(results);
  }
}

/* ---------- 导入 ---------- */
function handleImport(file){
  if(!file) return;
  var name = file.name.toLowerCase();
  if(name.endsWith('.epub')) importEpub(file);
  else if(name.endsWith('.html')||name.endsWith('.htm')) importHtml(file);
  else if(name.endsWith('.md')) importMarkdown(file);
  else if(name.endsWith('.txt')) importTxt(file);
  else if(name.endsWith('.json')) importJson(file);
  else alert('暂不支持该格式，可导入 EPUB / HTML / TXT / MD / JSON 工程文件');
}
function countChars(chapters){
  var n = 0;
  chapters.forEach(function(c){ var d = document.createElement('div'); d.innerHTML = c.html || ''; n += (d.textContent || '').length; });
  return n;
}
function applyImported(title, chapters, bookMeta){
  var edEl = $('#editor');
  var wasListening = removeEditorListeners();
  edEl.innerHTML = '';
  if(wasListening) addEditorListeners();
  if(bookMeta) state.book = Object.assign({}, state.book, bookMeta);
  if(title) state.book.title = title;
  state.chapters = chapters.map(function(c){ return { id:c.id || uid(), title: c.title || '未命名', html: c.html || '' }; });
  if(!state.chapters.length) state.chapters = [{ id:uid(), title:'第一章', html:'<p><br></p>' }];
  state.activeId = state.chapters[0].id;
  $('#bookTitle').value = state.book.title || '我的电子书';
  $('#bookAuthor').value = state.book.author || '';
  $('#bookLang').value = state.book.lang || 'zh-CN';
  document.title = (state.book.title||'电子书') + ' · 电子书编辑器';
  switchToChapter(state.activeId, true);
  scheduleSave();
}
function importTxt(file){
  var r = new FileReader();
  r.onload = function(e){
	try{
	  var text = String(e.target.result || '');
	  var lines = text.split(/\r\n?|\n/);
	  var html = '<pre style="white-space:pre-wrap;font-family:inherit;background:none;color:inherit;padding:0">' + esc(lines.join('\n')) + '</pre>';
	  var title = file.name.replace(/\.[^.]+$/,'') || '导入的书';
	  applyImported(title, [{ title:'全文', html: html }]);
	  toast('已导入 TXT（' + text.length + ' 字符），可继续编辑');
	}catch(err){ alert('TXT 导入失败：'+err.message); }
  };
  r.onerror = function(){ alert('读取文件失败'); };
  r.readAsText(file, 'utf-8');
}
function importMarkdown(file){
  var r = new FileReader();
  r.onload = function(e){
	try{
	  var md = String(e.target.result || '');
	  var title = file.name.replace(/\.[^.]+$/,'') || '导入的书';
	  applyImported(title, [{ title:'全文', html: markdownToHtml(md) }]);
	  toast('已导入 Markdown（' + md.length + ' 字符），可继续编辑');
	}catch(err){ alert('Markdown 导入失败：'+err.message); }
  };
  r.onerror = function(){ alert('读取文件失败'); };
  r.readAsText(file, 'utf-8');
}
function markdownToHtml(md){
  var lines = md.replace(/\r\n?/g,'\n').split('\n');
  var out = [], inCode = false, inUl = false, inOl = false, para = [];
  function flushPara(){ if(para.length){ out.push('<p>'+ inlineMd(para.join('<br>')) +'</p>'); para = []; } }
  function closeList(){ if(inUl){ out.push('</ul>'); inUl=false; } if(inOl){ out.push('</ol>'); inOl=false; } }
  lines.forEach(function(line){
	if(/^```/.test(line)){
	  flushPara(); closeList();
	  if(!inCode){ out.push('<pre><code>'); inCode=true; } else { out.push('</code></pre>'); inCode=false; }
	  return;
	}
	if(inCode){ out.push(esc(line)); return; }
	var h = line.match(/^(#{1,6})\s+(.*)$/);
	if(h){ flushPara(); closeList(); var lv = Math.min(h[1].length,3); out.push('<h'+lv+'>'+inlineMd(h[2])+'</h'+lv+'>'); return; }
	if(/^---+$/.test(line)){ flushPara(); closeList(); out.push('<hr>'); return; }
	if(/^>\s?/.test(line)){ flushPara(); closeList(); out.push('<blockquote>'+inlineMd(line.replace(/^>\s?/,''))+'</blockquote>'); return; }
	var ul = line.match(/^\s*[-*+]\s+(.*)$/);
	if(ul){ flushPara(); if(!inUl){ closeList(); out.push('<ul>'); inUl=true; } out.push('<li>'+inlineMd(ul[1])+'</li>'); return; }
	var ol = line.match(/^\s*\d+\.\s+(.*)$/);
	if(ol){ flushPara(); if(!inOl){ closeList(); out.push('<ol>'); inOl=true; } out.push('<li>'+inlineMd(ol[1])+'</li>'); return; }
	if(!line.trim()){ flushPara(); closeList(); return; }
	para.push(line);
  });
  flushPara(); closeList();
  if(inCode) out.push('</code></pre>');
  return out.join('\n');
}
function inlineMd(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  s = s.replace(/_([^_]+)_/g, '<em>$1</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2">$1</a>');
  return s;
}
function importHtml(file){
  var r = new FileReader();
  r.onload = function(e){
	try{
	  var raw = String(e.target.result || '');
	  var parser = new DOMParser();
	  var doc = parser.parseFromString(raw, 'text/html');
	  var title = (doc.querySelector('title') && doc.querySelector('title').textContent.trim()) || file.name.replace(/\.[^.]+$/,'');
	  var body = doc.body || doc.documentElement;
	  var bad = body.querySelectorAll('script,style,meta,link,iframe,object,embed');
	  for(var i=bad.length-1; i>=0; i--) bad[i].parentNode.removeChild(bad[i]);
	  var articles = body.querySelectorAll('article.chapter');
	  var chapters = [];
	  if(articles.length){
		articles.forEach(function(a, idx){
		  var h2 = a.querySelector('h2');
		  var t = h2 ? h2.textContent.trim() : ('第 ' + (idx+1) + ' 章');
		  var clone = a.cloneNode(true);
		  var ch2 = clone.querySelector('h2'); if(ch2) ch2.remove();
		  chapters.push({ title: t, html: clone.innerHTML });
		});
	  } else {
		chapters.push({ title: title || '第一章', html: body.innerHTML });
	  }
	  var coverSec = body.querySelector('.book-cover');
	  var bookMeta = { title: title };
	  if(coverSec){
		var bg = coverSec.getAttribute('style') || '';
		var m = bg.match(/linear-gradient\([^)]*#([0-9a-f]{6})[^)]*#([0-9a-f]{6})/i);
		if(m){
		  var idx = COVER_GRADS.findIndex(function(g){ return g[0].toLowerCase() === ('#'+m[1]).toLowerCase(); });
		  if(idx >= 0) bookMeta.cover = { type:'grad', idx: idx };
		}
		coverSec.remove();
	  }
	  applyImported(title, chapters, bookMeta);
	  toast('已导入 HTML，共 '+chapters.length+' 章，' + countChars(chapters) + ' 字符');
	}catch(err){ alert('HTML 导入失败：'+err.message); }
  };
  r.onerror = function(){ alert('读取文件失败'); };
  r.readAsText(file, 'utf-8');
}
function importJson(file){
  var r = new FileReader();
  r.onload = function(e){
	try{
	  var d = JSON.parse(String(e.target.result || '{}'));
	  var chapters = (d.chapters||[]).map(function(c){ return { id: c.id || uid(), title: c.title || '未命名', html: c.html || '' }; });
	  applyImported(d.book && d.book.title || '导入的书', chapters, d.book || {});
	  toast('已导入工程文件，共 '+chapters.length+' 章，' + countChars(chapters) + ' 字符');
	}catch(err){ alert('工程文件解析失败：'+err.message); }
  };
  r.onerror = function(){ alert('读取文件失败'); };
  r.readAsText(file, 'utf-8');
}

/* ---------- EPUB 导入 ---------- */
function importEpub(file){
  if(typeof DecompressionStream === 'undefined'){
	alert('当前浏览器不支持解压（DecompressionStream）。\n请使用 Chrome / Edge / Firefox / Safari 16.4+ 再导入 EPUB。');
	return;
  }
  readEpubFile(file);
}
function readEpubFile(file){
  var r = new FileReader();
  r.onload = function(ev){
	MiniZip.loadAsync(new Uint8Array(ev.target.result))
	  .then(function(zip){ return parseEpubZip(zip, file); })
	  .then(function(result){
		if(!result || !result.chapters.length){
		  alert('未在 EPUB 中找到章节内容。\n可能原因：\n1) 文件不是有效的 EPUB\n2) OPF 文件路径不标准\n3) 章节 XHTML 路径解析失败');
		  return;
		}
		applyImported(result.title, result.chapters, result.book);
		var imgCount = 0;
		result.chapters.forEach(function(c){ var d = document.createElement('div'); d.innerHTML = c.html || ''; imgCount += d.querySelectorAll('img').length; });
		var chars = countChars(result.chapters);
		toast('已导入 EPUB：' + result.chapters.length + ' 章，' + chars + ' 字符' + (imgCount ? '，' + imgCount + ' 张图片' : ''));
	  })
	  .catch(function(e){ alert('EPUB 解析失败：' + (e && e.message ? e.message : e)); });
  };
  r.onerror = function(){ alert('读取 EPUB 文件失败'); };
  r.readAsArrayBuffer(file);
}
function zipFind(zip, path){
  if(!path) return null;
  var decoded = path;
  try{ decoded = decodeURIComponent(path); }catch(e){}
  var candidates = [path, decoded, path.replace(/^\.\//,''), decoded.replace(/^\.\//,''), path.replace(/^\/+/,''), decoded.replace(/^\/+/,'')];
  for(var i=0;i<candidates.length;i++){
	var f = zip.file(candidates[i]);
	if(f) return f;
  }
  var lower = decoded.toLowerCase();
  var found = null;
  zip.forEach(function(relPath, entry){
	if(found) return;
	if(relPath.toLowerCase() === lower || relPath.toLowerCase().endsWith('/'+lower)) found = entry;
  });
  return found;
}
function guessImageMime(pathOrMime){
  if(!pathOrMime) return 'image/jpeg';
  if(/^image\//i.test(pathOrMime)) return pathOrMime.toLowerCase();
  var p = pathOrMime.toLowerCase().split('?')[0].split('#')[0];
  if(/\.jpe?g$/.test(p)) return 'image/jpeg';
  if(/\.png$/.test(p)) return 'image/png';
  if(/\.gif$/.test(p)) return 'image/gif';
  if(/\.webp$/.test(p)) return 'image/webp';
  if(/\.svg$/.test(p)) return 'image/svg+xml';
  if(/\.bmp$/.test(p)) return 'image/bmp';
  if(/\.ico$/.test(p)) return 'image/x-icon';
  if(/\.avif$/.test(p)) return 'image/avif';
  return 'image/jpeg';
}
function resolveZipPath(baseDir, href){
  var decodedHref = href;
  try{ decodedHref = decodeURIComponent(href); }catch(e){}
  decodedHref = decodedHref.split('#')[0];
  var qi = decodedHref.indexOf('?');
  if(qi >= 0) decodedHref = decodedHref.slice(0, qi);
  var parts = (baseDir || '').split('/').filter(Boolean);
  var rel = decodedHref.replace(/^\.\//,'').split('/');
  for(var i=0;i<rel.length;i++){
	var seg = rel[i];
	if(seg === '..'){ parts.pop(); }
	else if(seg === '.' || seg === ''){ }
	else parts.push(seg);
  }
  return parts.join('/');
}
function parseEpubZip(zip, file){
  return Promise.resolve()
	.then(function(){
	  var containerFile = zipFind(zip, 'META-INF/container.xml');
	  if(!containerFile) throw new Error('缺少 META-INF/container.xml，不是有效的 EPUB');
	  return containerFile.async('string');
	})
	.then(function(xml){
	  var m = xml.match(/full-path\s*=\s*"([^"]+)"/i);
	  if(!m) throw new Error('container.xml 中找不到 rootfile full-path');
	  var opfPath = decodeURIComponent(m[1]);
	  var base = opfPath.replace(/[^/]+$/,'');
	  var opfFile = zipFind(zip, opfPath);
	  if(!opfFile) throw new Error('找不到 OPF 文件：' + opfPath);
	  return opfFile.async('string').then(function(opf){ return { opf: opf, base: base }; });
	})
	.then(function(ctx){
	  var opf = ctx.opf, base = ctx.base;
	  var titleM = opf.match(/<dc:title[^>]*>([\s\S]*?)<\/dc:title>/i);
	  var authorM = opf.match(/<dc:creator[^>]*>([\s\S]*?)<\/dc:creator>/i);
	  var langM = opf.match(/<dc:language[^>]*>([\s\S]*?)<\/dc:language>/i);
	  var descM = opf.match(/<dc:description[^>]*>([\s\S]*?)<\/dc:description>/i);
	  var book = {
		title: titleM ? titleM[1].trim() : file.name.replace(/\.[^.]+$/,''),
		author: authorM ? authorM[1].trim() : '佚名',
		lang: langM ? langM[1].trim() : 'zh-CN',
		desc: descM ? descM[1].trim() : ''
	  };
	  var manifest = {};
	  var manifestBlock = opf.match(/<manifest[^>]*>([\s\S]*?)<\/manifest>/i);
	  if(manifestBlock){
		manifestBlock[1].replace(/<item\b([^>]*?)\/?>/gi, function(_, attrs){
		  var idM = attrs.match(/\bid\s*=\s*"([^"]+)"/i);
		  var hrefM = attrs.match(/\bhref\s*=\s*"([^"]+)"/i);
		  var mediaM = attrs.match(/\bmedia-type\s*=\s*"([^"]+)"/i);
		  var propsM = attrs.match(/\bproperties\s*=\s*"([^"]+)"/i);
		  if(idM && hrefM) manifest[idM[1]] = { href: hrefM[1], media: mediaM ? mediaM[1] : '', props: propsM ? propsM[1] : '' };
		  return '';
		});
	  }
	  var spine = [];
	  var spineBlock = opf.match(/<spine[^>]*>([\s\S]*?)<\/spine>/i);
	  if(spineBlock){
		spineBlock[1].replace(/<itemref\b([^>]*?)\/?>/gi, function(_, attrs){
		  var idrefM = attrs.match(/\bidref\s*=\s*"([^"]+)"/i);
		  if(idrefM && manifest[idrefM[1]]) spine.push(manifest[idrefM[1]]);
		  return '';
		});
	  }
	  if(!spine.length){
		Object.keys(manifest).forEach(function(k){ var it = manifest[k]; if(/xhtml|html/.test(it.media)) spine.push(it); });
	  }
	  return parseNavTitles(zip, base, manifest).then(function(navMap){
		var readPromises = spine.map(function(item){ return readChapterXhtml(zip, base, item.href, navMap); });
		return Promise.all(readPromises).then(function(chapters){
		  var validChapters = chapters.filter(Boolean);
		  return extractEpubImages(zip, base, validChapters).then(function(chaptersWithImgs){
			return { title: book.title, chapters: chaptersWithImgs, book: book };
		  });
		});
	  });
	});
}
function extractEpubImages(zip, base, chapters){
  var tasks = [];
  chapters.forEach(function(ch){
	if(!ch || !ch.html) return;
	var chapterHref = ch._href || '';
	var chapterDir = chapterHref ? chapterHref.replace(/[^/]+$/, '') : '';
	var fullDir = (base + chapterDir).replace(/^\/+/,'');
	var div = document.createElement('div');
	div.innerHTML = ch.html;
	var imgs = div.querySelectorAll('img');
	var changed = false;
	imgs.forEach(function(img){
	  var src = img.getAttribute('src') || '';
	  if(!src) return;
	  if(/^data:/i.test(src)) return;
	  if(/^https?:\/\//i.test(src)) return;
	  if(/^\/\//.test(src)) return;
	  var target = resolveZipPath(fullDir, src);
	  var file = zipFind(zip, target);
	  if(!file) return;
	  changed = true;
	  var mime = guessImageMime(target);
	  tasks.push(file.async('base64').then(function(b64){
		img.setAttribute('src', 'data:' + mime + ';base64,' + b64);
	  }).catch(function(){}));
	});
	ch._div = div;
	ch._changed = changed;
  });
  return Promise.all(tasks).then(function(){
	return chapters.map(function(ch){
	  if(!ch) return ch;
	  if(ch._changed && ch._div) ch.html = ch._div.innerHTML;
	  delete ch._div; delete ch._changed; delete ch._href;
	  return ch;
	});
  });
}
function parseNavTitles(zip, base, manifest){
  var navMap = {};
  var navItem = null;
  Object.keys(manifest).forEach(function(k){ if(/nav/.test(manifest[k].props)) navItem = manifest[k]; });
  var candidatePaths = [];
  if(navItem) candidatePaths.push((base + navItem.href).replace(/^\/+/,''));
  candidatePaths.push((base + 'nav.xhtml').replace(/^\/+/,''));
  candidatePaths.push((base + 'toc.xhtml').replace(/^\/+/,''));
  candidatePaths.push((base + 'toc.ncx').replace(/^\/+/,''));
  Object.keys(manifest).forEach(function(k){ var m = manifest[k]; if(/x-dtbncx/.test(m.media)) candidatePaths.push((base + m.href).replace(/^\/+/,'')); });
  var navFile = null;
  for(var i=0;i<candidatePaths.length;i++){ var f = zipFind(zip, candidatePaths[i]); if(f){ navFile = f; break; } }
  if(!navFile) return Promise.resolve(navMap);
  return navFile.async('string').then(function(txt){
	txt.replace(/<a\b[^>]*href\s*=\s*"([^"]+)"[^>]*>([\s\S]*?)<\/a>/gi, function(_, h, t){
	  var key = decodeURIComponent(h.split('#')[0].replace(/^\.\//,''));
	  var val = t.replace(/<[^>]+>/g,'').trim();
	  if(key && val) navMap[key] = val;
	  return '';
	});
	txt.replace(/<navPoint\b[\s\S]*?<text>([\s\S]*?)<\/text>[\s\S]*?<content\b[^>]*src\s*=\s*"([^"]+)"/gi, function(_, t, s){
	  var key = decodeURIComponent(s.split('#')[0].replace(/^\.\//,''));
	  var val = t.replace(/<[^>]+>/g,'').trim();
	  if(key && val) navMap[key] = val;
	  return '';
	});
	return navMap;
  }).catch(function(){ return navMap; });
}
function readChapterXhtml(zip, base, href, navMap){
  var cleanHref = decodeURIComponent(href.split('#')[0].replace(/^\.\//,''));
  var full = (base + cleanHref).replace(/^\/+/,'');
  var f = zipFind(zip, full);
  if(!f) return Promise.resolve(null);
  return f.async('string').then(function(html){
	var parser = new DOMParser();
	var doc = parser.parseFromString(html, 'text/html');
	var body = doc.body;
	if(!body) return null;
	var bad = body.querySelectorAll('script,style');
	for(var i=bad.length-1;i>=0;i--) bad[i].parentNode.removeChild(bad[i]);
	var h1 = body.querySelector('h1, h2');
	var titleFromNav = navMap[cleanHref] || navMap[href] || '';
	var titleFromH = h1 ? h1.textContent.trim() : '';
	var title = titleFromNav || titleFromH || cleanHref.replace(/\.(x?html?)$/i,'');
	return { id: uid(), title: title, html: body.innerHTML, _href: cleanHref };
  }).catch(function(){ return null; });
}

/* ---------- 同步/初始化 ---------- */
function syncAll(){
  $('#bookTitle').value = state.book.title;
  $('#bookAuthor').value = state.book.author || '';
  $('#bookLang').value = state.book.lang || 'zh-CN';
  document.title = state.book.title + ' · 电子书编辑器';
  if(!state.chapters.length){
	state.chapters.push({ id:uid(), title:'第一章', html:'' });
	state.activeId = state.chapters[0].id;
  }
  if(!state.activeId || !state.chapters.some(function(c){return c.id===state.activeId;})) state.activeId = state.chapters[0].id;
  switchToChapter(state.activeId, true);
  scheduleSave();
}
function bindDrag(){
  var hint = $('#dropHint'), counter = 0;
  window.addEventListener('dragenter', function(e){ if(hasFile(e)){ e.preventDefault(); counter++; hint.classList.add('show'); } });
  window.addEventListener('dragover', function(e){ if(hasFile(e)) e.preventDefault(); });
  window.addEventListener('dragleave', function(){ counter = Math.max(0,counter-1); if(!counter) hint.classList.remove('show'); });
  window.addEventListener('drop', function(e){
	if(!hasFile(e)) return;
	e.preventDefault(); counter=0; hint.classList.remove('show');
	var f = e.dataTransfer.files[0]; if(f) handleImport(f);
  });
  function hasFile(e){ return e.dataTransfer && e.dataTransfer.types && Array.prototype.indexOf.call(e.dataTransfer.types,'Files')>=0; }
}
function init(){
  var saved = null;
  try{ saved = localStorage.getItem(STORE_KEY); }catch(e){}
  bindTop(); bindToolbar(); bindConfirm(); addEditorListeners(); bindDrag();
  if(saved){
	try{
	  var d = JSON.parse(saved);
	  state.book = Object.assign(state.book, d.book||{});
	  state.chapters = (d.chapters||[]).map(function(c){ return { id:c.id||uid(), title:c.title||'未命名', html:c.html||'' }; });
	  state.activeId = d.activeId || null;
	}catch(e){ state.chapters = []; }
  }
  if(!state.chapters.length){
	state.chapters.push({
	  id: uid(), title: '第一章',
	  html: '<h1 style="text-align:center">第一章</h1><p><br></p><p>从这里开始写你的故事……</p>'
	});
  }
  if(!state.activeId || !state.chapters.some(function(c){return c.id===state.activeId;})) state.activeId = state.chapters[0].id;
  syncAll();
  $('#saveText').textContent = '已保存到本地';
  var resizeTimer = null;
  window.addEventListener('resize', function(){ clearTimeout(resizeTimer); resizeTimer = setTimeout(function(){ refreshViews(); }, 200); });
  window.addEventListener('beforeunload', function(){
	try{
	  flushEditor();
	  var data = JSON.stringify({
		book: state.book,
		chapters: state.chapters.map(function(c){ return { id:c.id, title:c.title, html:c.html }; }),
		activeId: state.activeId
	  });
	  if(data.length < 4 * 1024 * 1024) localStorage.setItem(STORE_KEY, data);
	}catch(e){}
  });
  initPWA();
  initBatchImage();
  initBookmark();
}

/* ============================================================
   批量插图
   ============================================================ */
function initBatchImage(){
  var btn = document.getElementById('btnBatchImage');
  if(!btn) return;
  btn.addEventListener('click', function(){
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
    inp.onchange = function(){
      var files = inp.files;
      if(!files || !files.length) return;
      if(files.length > 100 && !confirm('共选择 ' + files.length + ' 张，建议一次不超过 100 张。继续？')) return;
      insertManyImages(files);
    };
    inp.click();
  });
}
function compressImage(file){
  return new Promise(function(resolve){
    var fr = new FileReader();
    fr.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var MAX_PIXEL = 1600, QUALITY = 0.82;
        var w = img.width, h = img.height;
        var scale = Math.min(1, MAX_PIXEL / Math.max(w, h));
        var tw = Math.round(w * scale), th = Math.round(h * scale);
        try{
          var canvas = document.createElement('canvas');
          canvas.width = tw; canvas.height = th;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, tw, th);
          var mime = (file.type === 'image/png') ? 'image/png' : 'image/jpeg';
          var dataUrl = canvas.toDataURL(mime, QUALITY);
          resolve({ ok:true, dataUrl:dataUrl, name:file.name });
        }catch(err){ resolve({ ok:true, dataUrl:e.target.result, name:file.name }); }
      };
      img.onerror = function(){ resolve({ ok:false, name:file.name }); };
      img.src = e.target.result;
    };
    fr.onerror = function(){ resolve({ ok:false, name:file.name }); };
    fr.readAsDataURL(file);
  });
}
function insertManyImages(files){
  files = Array.prototype.slice.call(files);
  var total = files.length;
  var ed = document.getElementById('editor');
  if(!ed){ toast('编辑器未就绪'); return; }

  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(20,26,40,.55);z-index:400;display:grid;place-items:center;backdrop-filter:blur(3px)';
  overlay.innerHTML =
    '<div style="background:#fff;border-radius:14px;padding:24px 28px;min-width:260px;max-width:calc(100vw - 40px);text-align:center;box-shadow:0 20px 60px rgba(20,26,40,.3)">'
    + '<div style="font-weight:700;font-size:15px;margin-bottom:10px">正在插入图片 <span id="_bi_done" style="color:#2f6fed">0</span> / ' + total + '</div>'
    + '<div style="height:8px;background:#eef1f5;border-radius:8px;overflow:hidden;margin-bottom:10px">'
    +   '<div id="_bi_bar" style="height:100%;width:0%;background:linear-gradient(90deg,#4a7dff,#2f6fed);transition:width .2s"></div>'
    + '</div>'
    + '<div style="font-size:12px;color:#6b7280" id="_bi_name">准备中…</div>'
    + '</div>';
  document.body.appendChild(overlay);
  var bar = overlay.querySelector('#_bi_bar');
  var doneEl = overlay.querySelector('#_bi_done');
  var nameEl = overlay.querySelector('#_bi_name');

  var i = 0, failed = 0;
  function next(){
    if(i >= total){
      setTimeout(function(){
        overlay.remove();
        toast('已插入 ' + (total - failed) + ' 张图片' + (failed ? ('，' + failed + ' 张失败') : ''));
        try{ ed.dispatchEvent(new Event('input', { bubbles: true })); }catch(e){}
        try{
          ed.focus();
          var range = document.createRange();
          range.selectNodeContents(ed); range.collapse(false);
          var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
          var sc = document.getElementById('editorScroll');
          if(sc) sc.scrollTop = sc.scrollHeight;
        }catch(e){}
      }, 200);
      return;
    }
    var f = files[i];
    nameEl.textContent = '正在处理：' + f.name;
    compressImage(f).then(function(res){
      if(res.ok){
        var html = '<p><img src="' + res.dataUrl + '" alt="' + esc(res.name) + '" style="max-width:100%"></p>';
        try{ ed.focus(); document.execCommand('insertHTML', false, html); }
        catch(e){
          var range = document.createRange();
          range.selectNodeContents(ed); range.collapse(false);
          var frag = range.createContextualFragment(html);
          range.insertNode(frag);
        }
      } else { failed++; }
      i++;
      doneEl.textContent = String(i);
      bar.style.width = Math.round(i / total * 100) + '%';
      requestAnimationFrame(function(){ setTimeout(next, 10); });
    });
  }
  next();
}

/* ============================================================
   书签
   ============================================================ */
var BM_KEY = 'ebook_editor_bookmarks_v1';
function readBookmarks(){ try{ var r = localStorage.getItem(BM_KEY); return r ? JSON.parse(r) : []; }catch(e){ return []; } }
function writeBookmarks(list){ try{ localStorage.setItem(BM_KEY, JSON.stringify(list)); return true; }catch(e){ return false; } }
function bmId(){ return 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function textAround(editorEl){
  try{
    var sel = window.getSelection();
    if(!sel || !sel.rangeCount) return { pre:'', post:'', snippet:'' };
    var node = sel.getRangeAt(0).startContainer;
    var off = sel.getRangeAt(0).startOffset;
    var r0 = document.createRange();
    r0.selectNodeContents(editorEl);
    r0.setEnd(node, off);
    var idx = r0.toString().length;
    var fullText = editorEl.textContent || '';
    var pre = fullText.slice(Math.max(0, idx - 30), idx);
    var post = fullText.slice(idx, idx + 30);
    return { pre: pre, post: post, snippet: (pre + '|' + post).trim() };
  }catch(e){ return { pre:'', post:'', snippet:'' }; }
}

function insertAnchor(id){
  var ed = document.getElementById('editor'); if(!ed) return null;
  ed.focus();
  try{
    document.execCommand('insertHTML', false,
      '<span data-bm="' + id + '" class="bm-anchor"></span>');
  }catch(e){
    var range = document.createRange();
    range.selectNodeContents(ed); range.collapse(false);
    var span = document.createElement('span');
    span.setAttribute('data-bm', id); span.className = 'bm-anchor';
    range.insertNode(span);
  }
  return ed;
}

function addBookmark(name){
  flushEditor();
  try{ scheduleSave(); }catch(e){}
  var activeChapter = getActive();
  if(!activeChapter){ toast('请先选中章节'); return; }
  var id = bmId();
  var ed = insertAnchor(id);
  if(!ed){ toast('插入书签锚点失败'); return; }
  var info = textAround(ed);
  var list = readBookmarks();
  list.push({
    id: id,
    name: name || (info.pre.slice(-10) + info.post.slice(0,10) || ('书签 ' + (list.length + 1))),
    chapterId: activeChapter.id,
    chapterTitle: activeChapter.title || '未命名',
    snippet: info.snippet,
    createdAt: Date.now()
  });
  writeBookmarks(list);
  try{ ed.dispatchEvent(new Event('input', { bubbles: true })); }catch(e){}
  toast('已添加书签：' + (name || '新书签'));
}

function removeBookmark(id){
  var list = readBookmarks().filter(function(b){ return b.id !== id; });
  writeBookmarks(list);
  var changed = false;
  state.chapters.forEach(function(c){
    if(c.html && c.html.indexOf('data-bm="' + id + '"') >= 0){
      c.html = c.html.replace(new RegExp('<span[^>]*data-bm="' + id + '"[^>]*>\\s*</span>', 'g'), '');
      changed = true;
    }
  });
  if(changed){
    var ed = document.getElementById('editor');
    var cur = getActive();
    if(ed && cur) ed.innerHTML = cur.html;
    scheduleSave();
  }
  toast('已删除书签');
}

function jumpToBookmark(b){
  if(state.activeId !== b.chapterId){
    var tab = document.querySelector('#tabbar .tab[data-id="' + b.chapterId + '"]');
    if(tab) tab.click();
    else {
      var row = document.querySelector('#chapterList .chapter[data-id="' + b.chapterId + '"]');
      if(row) row.click();
    }
  }
  setTimeout(function(){
    var ed = document.getElementById('editor'); if(!ed) return;
    var span = ed.querySelector('[data-bm="' + b.id + '"]');
    if(span){
      span.scrollIntoView({ behavior:'smooth', block:'center' });
      var range = document.createRange();
      range.setStartBefore(span); range.collapse(true);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
      ed.focus();
      toast('已定位到书签：' + b.name);
      return;
    }
    toast('书签所在位置已变化，请重新添加');
  }, 260);
}

function openBookmarksPanel(){
  var old = document.getElementById('bmModal');
  if(old) old.remove();
  var list = readBookmarks();
  var rows = list.map(function(b, i){
    return '<div class="bm-row" data-id="' + b.id + '" style="display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fbfcfe;margin-bottom:6px">'
      + '<div style="width:22px;height:22px;border-radius:5px;background:#eef1f5;color:#6b7280;font-size:11px;display:grid;place-items:center;font-weight:700;flex-shrink:0">' + (i+1) + '</div>'
      + '<div style="flex:1;min-width:0">'
      +   '<div style="font-size:13px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(b.name) + '</div>'
      +   '<div style="font-size:11px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px">'
      +     esc(b.chapterTitle) + ' · ' + esc((b.snippet || '').slice(0, 40))
      +   '</div>'
      + '</div>'
      + '<button class="btn" data-jump="' + b.id + '" style="height:30px;padding:0 10px;font-size:12px;flex-shrink:0">跳转</button>'
      + '<button class="btn" data-del="' + b.id + '" style="height:30px;padding:0 10px;font-size:12px;flex-shrink:0;color:var(--danger)">删除</button>'
      + '</div>';
  }).join('');
  var modal = document.createElement('div');
  modal.id = 'bmModal';
  modal.className = 'modal-mask show';
  modal.innerHTML =
    '<div class="modal" style="width:min(480px,calc(100vw - 28px))">'
    + '<div class="modal-h">'
    +   '<span>书签（<span>' + list.length + '</span> 个）</span>'
    +   '<div class="mh-actions"><button class="mh-btn" data-close="bmModal">✕</button></div>'
    + '</div>'
    + '<div class="modal-b">'
    +   '<div class="field">'
    +     '<label>为当前位置添加书签</label>'
    +     '<div style="display:flex;gap:8px">'
    +       '<input id="_bm_name" placeholder="书签名称（可不填）" style="flex:1;border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:none;background:#fbfcfe;font-size:14px;font-family:inherit;color:inherit;min-width:0">'
    +       '<button class="btn primary" id="_bm_add" style="padding:0 16px;font-weight:600;white-space:nowrap">添加</button>'
    +     '</div>'
    +   '</div>'
    +   '<div class="field">'
    +     '<label>全部书签（点击"跳转"定位）</label>'
    +     '<div id="_bm_list" style="max-height:340px;overflow-y:auto;-webkit-overflow-scrolling:touch">'
    +       (list.length ? rows : '<div style="padding:24px;text-align:center;color:var(--sub);font-size:13px;line-height:1.7">还没有书签<br>把光标放到要标记的位置，点上方"添加"<br>或按 Ctrl/⌘ + B 一键添加</div>')
    +     '</div>'
    +   '</div>'
    + '</div>'
    + '<div class="modal-f"><button class="btn" data-close="bmModal">关闭</button></div>'
    + '</div>';
  document.body.appendChild(modal);
  modal.querySelectorAll('[data-close]').forEach(function(b){ b.onclick = function(){ modal.remove(); }; });
  modal.onclick = function(ev){ if(ev.target === modal) modal.remove(); };
  var addBtn = modal.querySelector('#_bm_add');
  var nameInput = modal.querySelector('#_bm_name');
  addBtn.onclick = function(){
    addBookmark((nameInput.value || '').trim());
    modal.remove();
    setTimeout(openBookmarksPanel, 200);
  };
  nameInput.addEventListener('keydown', function(ev){
    if(ev.key === 'Enter'){ ev.preventDefault(); addBtn.click(); }
  });
  modal.querySelectorAll('[data-jump]').forEach(function(btn){
    btn.onclick = function(){
      var id = btn.getAttribute('data-jump');
      var b = readBookmarks().find(function(x){ return x.id === id; });
      if(!b) return;
      modal.remove();
      jumpToBookmark(b);
    };
  });
  modal.querySelectorAll('[data-del]').forEach(function(btn){
    btn.onclick = function(){
      var id = btn.getAttribute('data-del');
      if(!confirm('删除这个书签？')) return;
      removeBookmark(id);
      modal.remove();
      setTimeout(openBookmarksPanel, 150);
    };
  });
}

function initBookmark(){
  var btn = document.getElementById('btnBookmark');
  if(btn) btn.onclick = openBookmarksPanel;
  document.addEventListener('keydown', function(ev){
    if(!(ev.ctrlKey || ev.metaKey) || ev.key.toLowerCase() !== 'b') return;
    var ed = document.getElementById('editor');
    if(!ed) return;
    if(document.activeElement !== ed && !ed.contains(document.activeElement)) return;
    ev.preventDefault();
    addBookmark('');
  });
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
else init();
})();
